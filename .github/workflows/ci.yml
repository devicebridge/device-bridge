name: CI

on:
  push:
  pull_request:

env:
  CGO_ENABLED: 0

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go fmt ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go test -race ./...

  serial-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: sudo apt-get update
      - run: sudo apt-get install -y socat
      - run: go test -tags=integration ./internal/source/scanner

  hid-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo modprobe uinput || true
      - run: sudo chmod 666 /dev/uinput || true
      - run: go test -tags=integration ./internal/source/hid
