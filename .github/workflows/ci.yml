name: CI

on:
  push:
  pull_request:

env:
  CGO_ENABLED: 0

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go fmt ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
